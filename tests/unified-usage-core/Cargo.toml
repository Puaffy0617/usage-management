[package]
name = "cc-switch-usage-core-verification"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
semver = "1"
minisign-verify = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tempfile = "3"
once_cell = "1"
process-wrap = { version = "8.2", features = ["tokio1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process", "io-util", "test-util"] }
url = "2.5"
dirs = "5"
