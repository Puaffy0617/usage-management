name: Publish signed custom Windows release

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Optional newer official x.y.z release to integrate; blank builds the configured bootstrap/custom revision"
        required: false
        type: string
  workflow_call:
    inputs:
      upstream_version:
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      CC_SWITCH_GOOGLE_OAUTH_CLIENT_ID:
        required: false
      CC_SWITCH_GOOGLE_OAUTH_CLIENT_SECRET:
        required: false

permissions:
  contents: read

concurrency:
  group: signed-custom-stable-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Puaffy0617/usage-management' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: "2"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      REQUESTED_UPSTREAM: ${{ inputs.upstream_version }}
      CC_SWITCH_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.CC_SWITCH_GOOGLE_OAUTH_CLIENT_ID }}
      CC_SWITCH_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CC_SWITCH_GOOGLE_OAUTH_CLIENT_SECRET }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: Install source dependencies without signing credentials
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Integrate and validate official update
        if: inputs.upstream_version != ''
        run: node scripts/maintain-upstream.mjs --target-version $env:REQUESTED_UPSTREAM --output "$env:RUNNER_TEMP/upstream-integration" --build
      - name: Build bootstrap or custom revision installer
        if: inputs.upstream_version == ''
        run: node scripts/hosted-release.mjs build --output "$env:RUNNER_TEMP/hosted-unsigned"
      - name: Bundle validated upstream candidate as NSIS installer
        if: inputs.upstream_version != ''
        run: node scripts/hosted-release.mjs build --source-dir "$env:RUNNER_TEMP/upstream-integration/candidate" --validated-result "$env:RUNNER_TEMP/upstream-integration/result.json" --upstream-version $env:REQUESTED_UPSTREAM --output "$env:RUNNER_TEMP/hosted-unsigned"
      - name: Upload immutable unsigned release input
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-custom-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/hosted-unsigned/*-setup.exe
            ${{ runner.temp }}/hosted-unsigned/*-source.zip
            ${{ runner.temp }}/hosted-unsigned/build-metadata.json

  sign-and-publish:
    needs: build
    if: github.repository == 'Puaffy0617/usage-management' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: custom-release
    permissions:
      contents: write
    env:
      REQUESTED_UPSTREAM: ${{ inputs.upstream_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/hosted-input
      - name: Install independent pinned signer without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/trusted-tauri" --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.12.4
      - name: Sign and verify immutable installer and signed version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=()
          if [ -n "$REQUESTED_UPSTREAM" ]; then args+=(--upstream-version "$REQUESTED_UPSTREAM"); fi
          node scripts/hosted-release.mjs sign --input "$RUNNER_TEMP/hosted-input" --output "$RUNNER_TEMP/hosted-signed" --tauri-cli "$RUNNER_TEMP/trusted-tauri/node_modules/@tauri-apps/cli/tauri.js" "${args[@]}"
      - name: Publish complete custom stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -n "$REQUESTED_UPSTREAM" ]; then args+=(--upstream-version "$REQUESTED_UPSTREAM"); fi
          node scripts/hosted-release.mjs publish --input "$RUNNER_TEMP/hosted-signed" "${args[@]}"

# Candidate code never executes in the job that receives the updater key.
# The publish job checks exact repository/key/channel/version, artifact hashes,
# required checks, Minisign signature and its signed version before publication.
